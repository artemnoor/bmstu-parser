services:
  university-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      UNIVERSITY_RESULT_DIR: /app/data/result
      UNIVERSITY_API_HOST: 0.0.0.0
      UNIVERSITY_API_PORT: 8000
      UNIVERSITY_ENV: ${UNIVERSITY_ENV:-development}
      UNIVERSITY_API_KEY: ${UNIVERSITY_API_KEY:-}
      UNIVERSITY_CORS_ORIGINS: ${UNIVERSITY_CORS_ORIGINS:-}
    volumes:
      - ../data/result:/app/data/result
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  university-frontend:
    image: nginx:1.27-alpine
    depends_on:
      university-api:
        condition: service_healthy
    ports:
      - "5173:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
