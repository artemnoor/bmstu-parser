[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmstu-education-parser"
version = "2.1.0"
description = "Canonical BMSTU bachelor education data ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "click>=8.1,<9",
    "duckdb>=1.0,<1.2",
]

[project.optional-dependencies]
docling = ["docling>=2.0,<3"]
dev = [
    "mypy>=1.11,<2",
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
bmstu-parser = "bmstu_parser.cli:main"
bmstu-api = "bmstu_parser.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
cache_dir = ".mypy_cache"
