[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "university-data-platform"
version = "3.0.0"
description = "Extensible university data ingestion and normalization platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "click>=8.1,<9",
    "duckdb>=1.0,<1.2",
    "openpyxl>=3.1,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
docling = ["docling>=2.0,<3"]
dev = [
    "mypy>=1.11,<2",
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "coverage>=7.5,<8",
    "ruff==0.16.5",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
university-data = "university_data.cli:main"
university-api = "university_data.api.cli:main"
bmstu-parser = "bmstu_parser.cli:main"
bmstu-api = "bmstu_parser.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [
    "university_data.domain",
    "university_data.normalization",
    "university_data.resolvers",
    "university_data.sources",
    "bmstu_parser.domain",
    "bmstu_parser.transform",
    "bmstu_parser.study_plans.semantic_curriculum",
    "bmstu_parser.study_plans.semantic_geometry",
    "bmstu_parser.study_plans.semantic_io",
    "bmstu_parser.study_plans.semantic_ontology",
    "bmstu_parser.study_plans.semantic_quality",
    "bmstu_parser.study_plans.semantic_reconciliation",
    "bmstu_parser.study_plans.semantic_schema",
    "bmstu_parser.study_plans.semantic_shared",
    "bmstu_parser.study_plans.semantics",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
cache_dir = ".mypy_cache"
