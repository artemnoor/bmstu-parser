name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy typed core
        run: mypy src/university_data --ignore-missing-imports
      - name: Unit and integration tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -p no:cacheprovider -p pytest_asyncio.plugin
      - name: Coverage run (Python 3.12)
        if: matrix.python-version == '3.12'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m coverage run -m pytest -q -p no:cacheprovider -p pytest_asyncio.plugin
      - name: Coverage threshold (Python 3.12)
        if: matrix.python-version == '3.12'
        run: python -m coverage report --fail-under=75
      - name: Verify namespaced repository
        run: >-
          python -c "from pathlib import Path; from university_data.api.repository import DatasetRepository;
          import tempfile; p=Path(tempfile.mkdtemp())/'fake'; (p/'canonical').mkdir(parents=True);
          (p/'canonical/programs.csv').write_text('id,name\nuniversity:fake:program:1,Smoke\n', encoding='utf-8');
          r=DatasetRepository(p.parent, 'fake'); assert r.page('programs', offset=0, limit=1)['total'] == 1"
      - name: Validate generated OpenAPI contract
        run: python -m json.tool ../contracts/openapi.json > /dev/null
      - name: Verify FakeUniversity pipeline
        run: >-
          python -c "from pathlib import Path; from tempfile import TemporaryDirectory;
          from university_data import REGISTRY; from university_data.pipeline import UniversityPipeline, PipelineOptions;
          d=TemporaryDirectory(); q=UniversityPipeline(REGISTRY).run('fake', PipelineOptions(output_dir=Path(d.name), strict=True)); d.cleanup(); assert q['verification']['passed']"

  docker:
    name: Docker · Poppler smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag university-data-platform-ci --file backend/Dockerfile backend
      - name: Check native PDF dependency
        run: >-
          docker run --rm university-data-platform-ci sh -c
          'command -v pdftotext && pdftotext -v && python -c
          "from university_data import REGISTRY; assert REGISTRY.ids() == (\"bmstu\", \"fake\", \"hse\"); assert REGISTRY.require(\"fake\").capabilities().teachers"'

  frontend:
    name: Frontend · Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run browser smoke
        working-directory: frontend
        run: npm run test:e2e
